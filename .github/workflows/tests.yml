name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declara requires-python >= 3.11; se prueba el
        # mínimo declarado y la versión fijada en .python-version.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Correr la batería de pruebas (unittest, sin dependencias)
        working-directory: Docker/router
        run: python -m unittest discover -s tests -t . -v

  shell-syntax:
    name: Sintaxis de scripts de despliegue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n sobre todos los .sh del repo
        run: |
          set -e
          status=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::fallo de sintaxis"
              status=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit $status
